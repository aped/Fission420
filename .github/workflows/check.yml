# One CI leg: `cargo xtask check` plus the release binaries, optionally packaged and uploaded.
# Called by ci.yml once per platform; see docs/CI.md.
name: check

on:
  workflow_call:
    inputs:
      name: { type: string, required: true }
      os: { type: string, required: true }
      container: { type: string, default: "" }
      # false: the leg runs fully and shows red on failure, but does not fail the workflow.
      gate: { type: boolean, default: true }
      # Archive name suffix; empty: never package.
      artifact: { type: string, default: "" }
      # Package and upload the binaries (main, tags, PRs into main, manual runs).
      publish: { type: boolean, default: false }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Match the local development toolchain so clippy lints agree (egui 0.36 needs >= 1.95).
  # Bump together with the local toolchain; see docs/CI.md.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  check:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    container: ${{ inputs.container }}
    timeout-minutes: 120
    continue-on-error: ${{ !inputs.gate }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Debian system packages
        if: inputs.container != ''
        env:
          DEBIAN_FRONTEND: noninteractive
        # C compiler for lzma-sys (truck-meshalgo -> vtkio -> xz2); nothing else is linked
        # at build time (wayland/x11/xkbcommon are dlopen'ed at runtime).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config liblzma-dev python3

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.name }}

      - name: Lockfile is current
        run: cargo fetch --locked

      - name: Build release binaries
        id: build
        run: cargo build --release --locked -p f420-app -p f420-cli

      - name: cargo xtask check
        id: check
        run: cargo xtask check

      - name: Committed examples unchanged by the replays
        if: inputs.name == 'ubuntu-24.04'
        # Warning only: cached measurements may differ in the last digit between libm
        # versions (developer glibc vs the runner's); a real drift shows up in the diff.
        run: |
          if ! git diff --quiet -- examples; then
            git diff --stat -- examples
            echo "::warning title=examples drift::cargo xtask check rewrote committed examples; regenerate and commit them"
          fi

      - name: Package
        id: package
        if: >-
          inputs.publish && inputs.artifact != '' && !cancelled()
          && steps.build.outcome == 'success'
          && (steps.check.outcome == 'success' || !inputs.gate)
        run: |
          name="fission420-${{ inputs.artifact }}"
          mkdir -p "dist/$name"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          cp "target/release/f420-app$exe" "target/release/f420-cli$exe" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          py=python3; command -v python3 >/dev/null || py=python
          "$py" tools/ci/third_party_licenses.py "$(rustc -vV | sed -n 's/^host: //p')" \
            "dist/$name/THIRD_PARTY_LICENSES.txt"
          git checkout -- examples   # ship the committed examples, not replay output
          cp -r examples "dist/$name/examples"
          # The example workflows export into artifacts/, which the CLI does not create (L3).
          mkdir -p "dist/$name/artifacts" && touch "dist/$name/artifacts/.keep"
          {
            echo "commit: ${GITHUB_SHA}"
            echo "platform: ${{ inputs.name }}"
            echo "toolchain: ${RUST_TOOLCHAIN}"
            echo "xtask check: ${{ steps.check.outcome }}"
            echo "Unsigned prototype build. Not an installer."
          } > "dist/$name/BUILD_INFO.txt"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            # tar keeps the executable bit, which a plain artifact upload drops.
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        # !cancelled(): without a status function `if` implies success(), which is false on a
        # non-gating leg whose check failed, so its archive would never upload.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: fission420-${{ inputs.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ inputs.name }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
