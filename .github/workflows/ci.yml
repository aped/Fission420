# Cross-platform CI: the local gate (`cargo xtask check`: layout, public text, fmt,
# clippy -D warnings, release tests, doc tests, headless acceptance, example replays) split
# into parallel jobs per platform (check.yml), plus release archives.
#
# Linux legs run on every push and PR. Windows and macOS, and archive publishing, run on main,
# v* tags, PRs into main and manual runs. Docs-only changes do not trigger CI.
# Pipeline shape, platform notes and how to change gating: docs/CI.md.
name: CI

on:
  push:
    branches: [main, "work/**", "ci/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to work branches and PRs are cancelled; main and tags always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
            container: ""
            lint: true
            artifact: linux-x86_64
          - name: debian-13
            os: ubuntu-24.04
            container: debian:trixie
            lint: false
            # Built against Debian 13's newer glibc; the Ubuntu 24.04 build is the
            # portable Linux artifact, so this leg only gates.
            artifact: ""
    uses: ./.github/workflows/check.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      container: ${{ matrix.container }}
      gate: true
      lint: ${{ matrix.lint }}
      shards: 2
      artifact: ${{ matrix.artifact }}
      examples-drift: ${{ matrix.container == '' }}
      publish: >-
        ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/v') || github.base_ref == 'main' }}

  cross:
    name: ${{ matrix.name }}
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v') || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            artifact: windows-x86_64
            gate: true
          - name: macos-arm64
            os: macos-15
            artifact: macos-arm64
            gate: true
    uses: ./.github/workflows/check.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      gate: ${{ matrix.gate }}
      shards: 2
      artifact: ${{ matrix.artifact }}
      publish: true

  release:
    name: release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, cross]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: r-cad-*
          path: dist
          merge-multiple: true
      - name: Create draft GitHub release (unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shopt -s nullglob
          # Every archive carries its own .sha256; check them, then list all in SHA256SUMS.
          sha256sum -c -- *.sha256
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" --draft --generate-notes \
            --title "R-CAD ${GITHUB_REF_NAME#v}"
