# Cross-platform CI: the local gate (`cargo xtask check`: layout, fmt, clippy -D warnings,
# release tests, headless acceptance, example replays) plus release binaries.
#
# Linux legs run on every push and PR. Windows and macOS, and binary publishing, run on main,
# v* tags, PRs into main and manual runs. Docs-only changes do not trigger CI.
# Platform notes, known failures and how to promote a leg to gating: docs/CI.md.
name: CI

on:
  push:
    branches: [main, "work/**", "ci/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to work branches and PRs are cancelled; main and tags always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  linux:
    name: check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
            container: ""
            artifact: linux-x86_64
          - name: debian-13
            os: ubuntu-24.04
            container: debian:trixie
            # Built against Debian 13's newer glibc; the Ubuntu 24.04 build is the
            # portable Linux artifact, so this leg only gates.
            artifact: ""
    uses: ./.github/workflows/check.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      container: ${{ matrix.container }}
      gate: true
      artifact: ${{ matrix.artifact }}
      publish: >-
        ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/v') || github.base_ref == 'main' }}

  cross:
    name: check (${{ matrix.name }})
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v') || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            artifact: windows-x86_64
          - name: macos-arm64
            os: macos-15
            artifact: macos-arm64
    uses: ./.github/workflows/check.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      # Not gating until the platform items in docs/CI.md (F1, F3) are fixed.
      gate: false
      artifact: ${{ matrix.artifact }}
      publish: true

  release:
    name: release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, cross]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fission420-*
          path: dist
          merge-multiple: true
      - name: Create draft GitHub release (unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --draft --generate-notes \
            --title "Fission420 ${GITHUB_REF_NAME} (unsigned prototype build)"
