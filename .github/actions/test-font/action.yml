# Liberation Sans for the sketch-text tests on macOS and Windows, which do not ship it
# (the Ubuntu image has it; the Debian container installs fonts-liberation). Used by the
# check.yml jobs that run tests or example replays. See docs/CI.md.
name: test font
description: Pinned Liberation Sans 2.1.5 on macOS and Windows, exported through RCAD_FONT_DIRS.
runs:
  using: composite
  steps:
    - name: Test font (Liberation Sans 2.1.5)
      if: runner.os != 'Linux'
      shell: bash
      # Pinned upstream release (SIL OFL 1.1), byte-identical to Fedora's and Debian's 2.1.5.
      run: |
        url=https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
        sum=7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0
        dir="$RUNNER_TEMP/test-fonts"
        mkdir -p "$dir"
        curl -sSLf --retry 3 -o "$dir/lf.tar.gz" "$url"
        if command -v sha256sum >/dev/null; then got=$(sha256sum "$dir/lf.tar.gz"); else got=$(shasum -a 256 "$dir/lf.tar.gz"); fi
        # Git Bash's sha256sum prefixes the line with "\" when the path holds backslashes.
        got=${got#\\}
        [ "${got%% *}" = "$sum" ] || { echo "::error::font archive checksum mismatch: ${got%% *}"; exit 1; }
        # Relative archive name: GNU tar reads "D:\..." as a remote host.
        (cd "$dir" && tar -xzf lf.tar.gz)
        echo "RCAD_FONT_DIRS=$dir" >> "$GITHUB_ENV"
