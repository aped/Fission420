[package]
name = "rcad-exchange"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust interchange adapters: STL mesh read/write and diagnostics, ASCII DXF sketch import/export, 3MF mesh read/write"

[dependencies]
rcad-cancel = { version = "0.1.0", path = "../rcad-cancel" }
rcad-sketch = { path = "../rcad-sketch" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
# 3MF: ZIP container (deflate + CRC-32) and XML tokenizer. All three were already in
# Cargo.lock (via png/image and wayland-scanner); see docs/DEPENDENCIES.md.
miniz_oxide = "0.8.9"
crc32fast = "1.5.2"
quick-xml = { version = "0.41.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.151"
