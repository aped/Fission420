[package]
name = "rcad-document"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Feature history, parameters, regeneration, undo and the native format of R-CAD"

[dependencies]
rcad-cancel.workspace = true
rcad-kernel.workspace = true
rcad-sketch.workspace = true
rcad-exchange.workspace = true
serde.workspace = true
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror.workspace = true

[features]
# Test-only fault injection (a feature named `__panic__` panics when
# evaluated); enabled by dev-dependencies, never by shipping builds.
test-hooks = []

[dev-dependencies]
tempfile.workspace = true
