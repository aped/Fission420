[package]
name = "rcad-document"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rcad-kernel = { version = "0.1.0", path = "../rcad-kernel" }
rcad-sketch = { version = "0.1.0", path = "../rcad-sketch" }
rcad-exchange = { version = "0.1.0", path = "../rcad-exchange" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
