[package]
name = "rcad"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rcad-viewport = { path = "../rcad-viewport" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rcad-commands = { path = "../rcad-commands" }
rcad-document = { path = "../rcad-document" }
rcad-kernel = { path = "../rcad-kernel" }
rcad-sketch = { path = "../rcad-sketch" }
rcad-exchange = { path = "../rcad-exchange" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
egui_kittest = { version = "0.36.2", default-features = false }
tempfile = "3.27.0"
