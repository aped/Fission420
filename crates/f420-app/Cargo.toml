[package]
name = "f420-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
f420-viewport = { path = "../f420-viewport" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
f420-commands = { path = "../f420-commands" }
f420-document = { path = "../f420-document" }
f420-kernel = { path = "../f420-kernel" }
f420-sketch = { path = "../f420-sketch" }

[dev-dependencies]
egui_kittest = { version = "0.36.2", default-features = false }
